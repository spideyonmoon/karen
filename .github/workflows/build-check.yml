name: Build Check

# Compiles the bot on feature branches and pull requests so a broken build is caught
# on GitHub BEFORE it can be merged to main and shipped to the VPS. This job never
# touches the server — it only answers "does it compile?" on a throwaway runner.
# It runs independently of deploy.yml (separate file = separate workflow).
#
# Excludes pushes to main: a main push already triggers deploy.yml, whose own
# `docker compose up --build` is the build gate there, so a Build Check run on main
# would be redundant. PRs targeting main are still checked (that's the pre-merge gate).
on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the exact Go version from the module so CI matches local.
          go-version-file: bot/go.mod

          # Enable built-in caching
          cache: true

          # Crucial: Direct the cache to your subdirectory's checksum file
          cache-dependency-path: bot/go.sum

      - name: go build
        working-directory: bot
        run: go build ./...

      - name: test collection delivery order
        working-directory: bot
        # Named files avoid the Go test harness importing the module named "main".
        run: go test -run '^TestCollectionDelivery' *.go

      - name: validate bootstrap scripts
        run: bash -n setup.sh generate.sh do-login.sh

      - name: validate login helper
        run: python -m py_compile login/login.py

      - name: build and validate runnable bot image
        run: |
          cp bot/config.yaml.example bot/config.yaml
          docker build -t karen-bot-check ./bot
          docker run --rm --entrypoint /bin/sh karen-bot-check -c \
            'set -e; test -x /usr/local/bin/apple-music-dl; for f in /usr/local/bin/apple-music-dl /usr/local/lib/libtemari.so; do deps="$(ldd "$f")"; echo "$deps"; ! echo "$deps" | grep -q "not found"; done'

      - name: build pinned wrapper-manager image
        run: docker build -t karen-wrapper-manager-check ./wrapper-manager
