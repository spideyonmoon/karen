name: Deploy Karen Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/karen
            git fetch origin main
            # Do not use git clean: .env, bot state/downloads and the v3 account
            # registry are intentionally persistent and gitignored.
            rm -f do-login.sh
            git reset --hard origin/main
            # setup.sh is idempotent. It regenerates config, builds the pinned v2
            # manager + HTTP login helper, reconciles Apple accounts, and rebuilds
            # the Temari-enabled bot. On the first v3 deploy it also removes the old
            # wrapper containers while preserving their volumes for rollback.
            ./setup.sh
